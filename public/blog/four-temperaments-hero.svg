<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef7e6"/>
      <stop offset="100%" stop-color="#f5e6c5"/>
    </linearGradient>
  </defs>

  <!-- 배경 (양피지 톤 — 학술적 권위) -->
  <rect width="1200" height="900" fill="url(#bg-t)"/>

  <!-- 뱃지 -->
  <rect x="70" y="80" rx="10" width="380" height="56" fill="#1a1a1a"/>
  <text x="260" y="118" text-anchor="middle" font-size="22" font-weight="900" fill="#fef7e6" letter-spacing="1">📜 BC 400 → 2026 · 2400년</text>

  <!-- 메인 카피 -->
  <text x="70" y="200" font-size="62" font-weight="900" fill="#1a1a1a" letter-spacing="-3">히포크라테스 4기질</text>

  <!-- 학술 계보 라인 (시간 흐름 시각화) -->
  <g transform="translate(70, 245)">
    <line x1="0" y1="20" x2="1060" y2="20" stroke="#1a1a1a" stroke-width="2" opacity="0.4"/>
    <!-- BC 400 -->
    <circle cx="0" cy="20" r="6" fill="#1a1a1a"/>
    <text x="0" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1a1a">BC 400</text>
    <text x="0" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" opacity="0.7">히포크라테스</text>
    <!-- AD 200 -->
    <circle cx="180" cy="20" r="6" fill="#1a1a1a"/>
    <text x="180" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1a1a">AD 200</text>
    <text x="180" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" opacity="0.7">갈렌</text>
    <!-- 1798 -->
    <circle cx="430" cy="20" r="6" fill="#1a1a1a"/>
    <text x="430" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1a1a">1798</text>
    <text x="430" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" opacity="0.7">칸트</text>
    <!-- 1957 -->
    <circle cx="680" cy="20" r="6" fill="#1a1a1a"/>
    <text x="680" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1a1a">1957</text>
    <text x="680" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" opacity="0.7">아이젠크</text>
    <!-- 2009 -->
    <circle cx="880" cy="20" r="6" fill="#1a1a1a"/>
    <text x="880" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#1a1a1a">2009</text>
    <text x="880" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" opacity="0.7">피셔</text>
    <!-- 2026 -->
    <circle cx="1060" cy="20" r="8" fill="#b45309"/>
    <text x="1060" y="55" text-anchor="middle" font-size="14" font-weight="900" fill="#b45309">2026</text>
    <text x="1060" y="72" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">192조합</text>
  </g>

  <!-- 4기질 박스 (4개 가로 배치) -->
  <g transform="translate(70, 360)">
    <!-- 다혈질 (sanguine) -->
    <rect x="0" y="0" rx="14" width="250" height="240" fill="#fbbf24" opacity="0.30"/>
    <rect x="0" y="0" rx="14" width="250" height="240" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="125" y="50" text-anchor="middle" font-size="22" font-weight="900" fill="#b45309">🌸 봄바람</text>
    <text x="125" y="100" text-anchor="middle" font-size="36" font-weight="900" fill="#1a1a1a">다혈질</text>
    <text x="125" y="135" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a1a" opacity="0.7">Sanguine</text>
    <text x="125" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">도파민 우세</text>
    <text x="125" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a" opacity="0.85">사교·낙관·즉흥</text>
    <text x="125" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" opacity="0.7">한국 ~30%</text>

    <!-- 담즙질 (choleric) -->
    <rect x="270" y="0" rx="14" width="250" height="240" fill="#dc2626" opacity="0.18"/>
    <rect x="270" y="0" rx="14" width="250" height="240" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="395" y="50" text-anchor="middle" font-size="22" font-weight="900" fill="#dc2626">☀️ 여름태양</text>
    <text x="395" y="100" text-anchor="middle" font-size="36" font-weight="900" fill="#1a1a1a">담즙질</text>
    <text x="395" y="135" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a1a" opacity="0.7">Choleric</text>
    <text x="395" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">노르에피네프린</text>
    <text x="395" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a" opacity="0.85">목표·실행·통제</text>
    <text x="395" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" opacity="0.7">한국 ~10%</text>

    <!-- 점액질 (phlegmatic) -->
    <rect x="540" y="0" rx="14" width="250" height="240" fill="#16a34a" opacity="0.20"/>
    <rect x="540" y="0" rx="14" width="250" height="240" fill="none" stroke="#16a34a" stroke-width="3"/>
    <text x="665" y="50" text-anchor="middle" font-size="22" font-weight="900" fill="#16a34a">🍂 가을 안개</text>
    <text x="665" y="100" text-anchor="middle" font-size="36" font-weight="900" fill="#1a1a1a">점액질</text>
    <text x="665" y="135" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a1a" opacity="0.7">Phlegmatic</text>
    <text x="665" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">세로토닌 우세</text>
    <text x="665" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a" opacity="0.85">안정·평화·일관</text>
    <text x="665" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" opacity="0.7">한국 ~38%</text>

    <!-- 우울질 (melancholic) -->
    <rect x="810" y="0" rx="14" width="250" height="240" fill="#1e40af" opacity="0.20"/>
    <rect x="810" y="0" rx="14" width="250" height="240" fill="none" stroke="#1e40af" stroke-width="3"/>
    <text x="935" y="50" text-anchor="middle" font-size="22" font-weight="900" fill="#1e40af">❄️ 겨울 호수</text>
    <text x="935" y="100" text-anchor="middle" font-size="36" font-weight="900" fill="#1a1a1a">우울질</text>
    <text x="935" y="135" text-anchor="middle" font-size="16" font-weight="800" fill="#1a1a1a" opacity="0.7">Melancholic</text>
    <text x="935" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">저각성 + 깊은 처리</text>
    <text x="935" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a" opacity="0.85">분석·완성도·섬세</text>
    <text x="935" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a" opacity="0.7">한국 ~22%</text>
  </g>

  <!-- 결합 박스 -->
  <g transform="translate(70, 645)">
    <rect x="0" y="0" rx="12" width="1060" height="100" fill="#1a1a1a" opacity="0.92"/>
    <text x="40" y="40" font-size="22" font-weight="900" fill="#ffd700">MBTI 16유형 × 4기질 × 보조 기질 = 192조합</text>
    <text x="40" y="72" font-size="17" font-weight="700" fill="#fef7e6" opacity="0.9">같은 INFP라도 우울질 INFP는 예술가형, 다혈질 INFP는 사교적 표현자형으로 살아간다</text>
  </g>

  <!-- 하단 태그 -->
  <rect x="70" y="775" width="14" height="56" fill="#b45309"/>
  <text x="100" y="803" font-size="22" font-weight="900" fill="#1a1a1a">현대 신경과학으로 검증된 4가지 신경계 패턴</text>
  <text x="100" y="830" font-size="16" font-weight="700" fill="#1a1a1a" opacity="0.8">Hippocrates · Galen · Kant · Eysenck · Fisher 학술 계보</text>

  <text x="1130" y="850" text-anchor="end" font-size="16" font-weight="800" fill="#b45309">192types.co.kr</text>
</svg>