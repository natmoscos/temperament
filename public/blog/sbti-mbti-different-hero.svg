<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow-l" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ff2d8a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff2d8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-r" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow-l)"/>
  <rect width="1200" height="900" fill="url(#glow-r)"/>

  <!-- 뱃지 -->
  <rect x="70" y="80" rx="10" width="380" height="56" fill="#f5ff3d"/>
  <text x="260" y="118" text-anchor="middle" font-size="22" font-weight="900" fill="#0a0a0a" letter-spacing="1">📚 학술 답변 · 측정 차원 분석</text>

  <!-- 메인 카피 -->
  <text x="70" y="210" font-size="50" font-weight="900" fill="#ffffff" opacity="0.85" letter-spacing="-2">같은 사람인데</text>
  <text x="70" y="290" font-size="68" font-weight="900" fill="#f5ff3d" letter-spacing="-3">결과는 완전 달라?</text>

  <!-- 비교 박스 좌·우 -->
  <g transform="translate(70, 370)">
    <!-- SBTI 박스 (좌측 핑크) -->
    <rect x="0" y="0" rx="14" width="510" height="170" fill="#ff2d8a" opacity="0.18"/>
    <rect x="0" y="0" rx="14" width="510" height="170" fill="none" stroke="#ff2d8a" stroke-width="3"/>
    <text x="40" y="55" font-size="40" font-weight="900" fill="#ff2d8a" letter-spacing="-1">SBTI</text>
    <text x="170" y="55" font-size="22" font-weight="800" fill="#ffffff">CTRL</text>
    <text x="40" y="100" font-size="20" font-weight="700" fill="#ffffff" opacity="0.85">행동 패턴 매칭형</text>
    <text x="40" y="135" font-size="16" font-weight="700" fill="#ffffff" opacity="0.7">27유형 × 5대 영역 × 15차원</text>

    <!-- 양방향 화살표 (위에 ≠) -->
    <text x="585" y="80" text-anchor="middle" font-size="44" font-weight="900" fill="#f5ff3d">≠</text>
    <text x="585" y="120" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" opacity="0.85">다른 차원</text>

    <!-- MBTI 박스 (우측 시안) -->
    <rect x="610" y="0" rx="14" width="510" height="170" fill="#00e5ff" opacity="0.18"/>
    <rect x="610" y="0" rx="14" width="510" height="170" fill="none" stroke="#00e5ff" stroke-width="3"/>
    <text x="650" y="55" font-size="40" font-weight="900" fill="#00e5ff" letter-spacing="-1">MBTI</text>
    <text x="790" y="55" font-size="22" font-weight="800" fill="#ffffff">INFP</text>
    <text x="650" y="100" font-size="20" font-weight="700" fill="#ffffff" opacity="0.85">인지기능 양식 분류형</text>
    <text x="650" y="135" font-size="16" font-weight="700" fill="#ffffff" opacity="0.7">16범주 × Jung 8기능</text>
  </g>

  <!-- 본질 카피 -->
  <rect x="70" y="600" width="14" height="64" fill="#f5ff3d"/>
  <text x="100" y="640" font-size="44" font-weight="900" fill="#f5ff3d" letter-spacing="-2">측정 차원이 다르다</text>
  <text x="100" y="678" font-size="22" font-weight="700" fill="#ffffff" opacity="0.9">검사 오류 아님 — 두 검사가 다른 각도로 본다</text>

  <!-- 학술 출처 박스 -->
  <g transform="translate(70, 710)">
    <rect x="0" y="0" rx="10" width="1060" height="60" fill="#ffffff" opacity="0.08"/>
    <rect x="0" y="0" rx="10" width="1060" height="60" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <text x="30" y="38" font-size="18" font-weight="800" fill="#fbbf24">📖 Pittenger 1993 · McCrae &amp; Costa 1989 · Boyle 1995 · 아푸 SBTI 공식 자료</text>
  </g>

  <!-- 하단 태그라인 -->
  <rect x="70" y="800" width="14" height="56" fill="#f5ff3d"/>
  <text x="100" y="828" font-size="24" font-weight="900" fill="#ffffff">결과 차이의 5가지 원인 + FAQ 6 + 일반화 매핑</text>
  <text x="100" y="855" font-size="16" font-weight="700" fill="#ffffff" opacity="0.85">범주형 vs 태그 매칭형 · 신뢰도 33년 vs 0년 · 학술 인용</text>

  <text x="1130" y="876" text-anchor="end" font-size="16" font-weight="800" fill="#f5ff3d">192types.co.kr</text>
</svg>