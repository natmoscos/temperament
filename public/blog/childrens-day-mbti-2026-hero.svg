<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- D-Day 뱃지 -->
  <rect x="70" y="80" rx="10" width="320" height="56" fill="#ea580c"/>
  <text x="230" y="118" text-anchor="middle" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">🎁 5월 5일 D-3 가이드</text>

  <!-- 메인 카피 1 -->
  <text x="70" y="210" font-size="76" font-weight="900" fill="#0a0a0a" letter-spacing="-3">어린이날 2026</text>

  <!-- 충격 통계 (취소선 + 강조) -->
  <text x="70" y="295" font-size="40" font-weight="800" fill="#ea580c" letter-spacing="-1">자녀가 좋아할 줄 알았는데</text>
  <text x="70" y="345" font-size="40" font-weight="800" fill="#0a0a0a" opacity="0.55">"별로야"</text>
  <line x1="55" y1="332" x2="240" y2="332" stroke="#ea580c" stroke-width="6"/>

  <!-- 충격 숫자 -->
  <rect x="70" y="385" width="14" height="76" fill="#ea580c"/>
  <text x="100" y="430" font-size="68" font-weight="900" fill="#0a0a0a" letter-spacing="-2">선물 50% 실패</text>
  <text x="100" y="468" font-size="20" font-weight="700" fill="#0a0a0a" opacity="0.75">한국갤럽 2024 어린이날 만족도 조사</text>

  <!-- 4분류 박스 -->
  <g transform="translate(70, 510)">
    <!-- SJ -->
    <rect x="0" y="0" rx="14" width="250" height="130" fill="#fbbf24" opacity="0.30"/>
    <rect x="0" y="0" rx="14" width="250" height="130" fill="none" stroke="#d97706" stroke-width="3"/>
    <text x="125" y="42" text-anchor="middle" font-size="22" font-weight="900" fill="#d97706">SJ 관리자형</text>
    <text x="125" y="80" text-anchor="middle" font-size="42" font-weight="900" fill="#0a0a0a">38%</text>
    <text x="125" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a" opacity="0.7">반복·전통·디테일</text>

    <!-- SP -->
    <rect x="270" y="0" rx="14" width="250" height="130" fill="#ff7a59" opacity="0.25"/>
    <rect x="270" y="0" rx="14" width="250" height="130" fill="none" stroke="#ea580c" stroke-width="3"/>
    <text x="395" y="42" text-anchor="middle" font-size="22" font-weight="900" fill="#ea580c">SP 탐험가형</text>
    <text x="395" y="80" text-anchor="middle" font-size="42" font-weight="900" fill="#0a0a0a">30%</text>
    <text x="395" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a" opacity="0.7">활동·체험·즉흥</text>

    <!-- NF -->
    <rect x="540" y="0" rx="14" width="250" height="130" fill="#a78bfa" opacity="0.30"/>
    <rect x="540" y="0" rx="14" width="250" height="130" fill="none" stroke="#6d28d9" stroke-width="3"/>
    <text x="665" y="42" text-anchor="middle" font-size="22" font-weight="900" fill="#6d28d9">NF 외교관형</text>
    <text x="665" y="80" text-anchor="middle" font-size="42" font-weight="900" fill="#0a0a0a">18%</text>
    <text x="665" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a" opacity="0.7">감정·상상·관계</text>

    <!-- NT -->
    <rect x="810" y="0" rx="14" width="250" height="130" fill="#10b981" opacity="0.28"/>
    <rect x="810" y="0" rx="14" width="250" height="130" fill="none" stroke="#047857" stroke-width="3"/>
    <text x="935" y="42" text-anchor="middle" font-size="22" font-weight="900" fill="#047857">NT 분석가형</text>
    <text x="935" y="80" text-anchor="middle" font-size="42" font-weight="900" fill="#0a0a0a">14%</text>
    <text x="935" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0a0a0a" opacity="0.7">호기심·논리·왜?</text>
  </g>

  <!-- 하단 태그라인 -->
  <rect x="70" y="700" width="14" height="60" fill="#ea580c"/>
  <text x="100" y="730" font-size="28" font-weight="900" fill="#0a0a0a">자녀 MBTI별 선물·활동 정답</text>
  <text x="100" y="762" font-size="20" font-weight="700" fill="#0a0a0a" opacity="0.8">5질문 추정 + 부모×자녀 상호작용 매트릭스 · 5/5까지 3일</text>

  <!-- 학술 출처 -->
  <text x="70" y="820" font-size="16" font-weight="700" fill="#ea580c">📚 한국갤럽 2024 · Norton 2012 IKEA 효과 · Pittenger 신뢰도</text>

  <text x="1130" y="862" text-anchor="end" font-size="16" font-weight="800" fill="#ea580c">192types.co.kr</text>
</svg>